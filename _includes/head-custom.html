<!-- GitHub Pages does not render Mermaid code blocks; this turns them into diagrams in the browser. -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  const blocks = document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid");
  blocks.forEach((block) => {
    const diagram = document.createElement("pre");
    diagram.className = "mermaid";
    diagram.textContent = block.textContent;
    (block.matches("code") ? block.parentElement : block).replaceWith(diagram);
  });
  mermaid.initialize({ startOnLoad: false });
  await mermaid.run();
</script>
